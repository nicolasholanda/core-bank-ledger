services:
  postgres:
    image: postgres:16-alpine
    container_name: core-bank-ledger-db
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger_data:/var/lib/postgresql/data

volumes:
  ledger_data:
